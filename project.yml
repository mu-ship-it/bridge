name: Bridge
configFiles:
  Debug: Config/Bridge.xcconfig
  Release: Config/Bridge.xcconfig
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.5"
    # The real build number is the git commit count, stamped into the built Info.plist by the
    # "Build number" script on the app and the widget (they must match).
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Bundle id, team and default server URL come from Config/Bridge.xcconfig (+ your gitignored Config/Local.xcconfig).
    # Simulator builds are ad-hoc signed ("sign to run locally"); no team needed.
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    # The Mac host + widget share a Keychain group, which ad-hoc signing cannot carry: they need
    # DEVELOPMENT_TEAM in Local.xcconfig (a free Personal Team works) and an Apple Development cert.
    "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
targets:
  Bridge:
    type: application
    platform: iOS
    sources: [Bridge, Shared]
    dependencies:
      - target: BridgeWidget
    settings:
      base:
        PRODUCT_NAME: Bridge
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # the build-number script reads .git
        PRODUCT_BUNDLE_IDENTIFIER: $(BRIDGE_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: 白手套
    info:
      path: Bridge/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: 白手套
        UILaunchScreen: {}
        # iPad: any orientation, resizable (Stage Manager / Split View), several windows at once.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIRequiresFullScreen: false
        # Landscape is listed for the desk display only: AppDelegate keeps every other screen portrait.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSHealthShareUsageDescription: "Bridge reads your health data (heart rate, HRV, sleep, workouts, steps…) and sends it only to the server URL you configure."
        NSLocationWhenInUseUsageDescription: "Bridge reports your current location to your server when it asks."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Bridge uses significant location changes to wake up and check your server for jobs, and reports a one-shot location when the server asks. No continuous GPS."
        NSCalendarsFullAccessUsageDescription: "Bridge lists your upcoming calendar events when your server asks, and sends them only to the server URL you configure."
        NSRemindersFullAccessUsageDescription: "Bridge lists and adds reminders when your server asks, and sends them only to the server URL you configure."
        NSContactsUsageDescription: "Bridge looks up a contact's name, phone numbers and emails when your server asks, and sends at most 20 matches to the server URL you configure."
        NSPhotoLibraryUsageDescription: "Bridge sends small, downscaled copies of your most recent photos to your server when it asks. Full-resolution images never leave the phone."
        NSMotionUsageDescription: "Bridge reports today's steps, distance and floors, and barometer readings, to your server when it asks."
        NSCameraUsageDescription: "Bridge opens the camera on screen when your server asks for a photo or a barcode scan. You see what the camera sees the whole time, and you take photos yourself."
        NSMicrophoneUsageDescription: "Bridge records a short voice clip when your server asks, while the app is open (iOS shows the orange dot). The clip goes only to the server URL you configure."
        NSSpeechRecognitionUsageDescription: "Bridge turns a voice clip it just recorded into text, on the phone when possible, and sends the text only to the server URL you configure."
        NFCReaderUsageDescription: "Bridge reads an NFC tag you hold the phone to when your server asks, and sends what the tag contains to the server URL you configure."
        NSHomeKitUsageDescription: "Bridge lists and controls the accessories already set up in Apple's Home app when your server asks, while the app is open. Unlocking, opening a garage door or disarming always asks you first."
        # The Suggest widget's app catalog (server/suggest.example.json), so canOpenURL can see them.
        LSApplicationQueriesSchemes: [weixin, alipays, tg, xhsdiscover]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [fetch, processing, remote-notification, location]
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
          - $(PRODUCT_BUNDLE_IDENTIFIER).processing
        BridgeDefaultServerURL: $(BRIDGE_DEFAULT_SERVER_URL)
        # Shared with the widget: the snapshot file (App Group) and the box token (Keychain group).
        BridgeAppGroup: group.$(BRIDGE_BUNDLE_ID)
        BridgeKeychainGroup: $(AppIdentifierPrefix)$(BRIDGE_BUNDLE_ID)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    postBuildScripts:
      - name: Build number = git commit count
        basedOnDependencyAnalysis: false
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]   # run after Info.plist is processed
        script: |
          count=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo "$CURRENT_PROJECT_VERSION")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $count" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    entitlements:
      path: Bridge/Bridge.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        aps-environment: development
        com.apple.developer.networking.wifi-info: true
        com.apple.developer.homekit: true
        com.apple.developer.nfc.readersession.formats: [TAG]
        com.apple.security.application-groups: [group.$(BRIDGE_BUNDLE_ID)]
        # The app's own default group first, so Keychain items saved before v0.4 stay where they are.
        keychain-access-groups: [$(AppIdentifierPrefix)$(BRIDGE_BUNDLE_ID)]
  BridgeWidget:
    type: app-extension
    platform: iOS
    sources: [BridgeWidget, Shared]
    settings:
      base:
        PRODUCT_NAME: BridgeWidget
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(BRIDGE_BUNDLE_ID).widget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: 白手套
    info:
      path: BridgeWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: 白手套
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        BridgeAppBundleID: $(BRIDGE_BUNDLE_ID)
        BridgeAppGroup: group.$(BRIDGE_BUNDLE_ID)
        BridgeKeychainGroup: $(AppIdentifierPrefix)$(BRIDGE_BUNDLE_ID)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    postBuildScripts:
      - name: Build number = git commit count
        basedOnDependencyAnalysis: false
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]   # run after Info.plist is processed
        script: |
          count=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo "$CURRENT_PROJECT_VERSION")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $count" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    entitlements:
      path: BridgeWidget/BridgeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BRIDGE_BUNDLE_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(BRIDGE_BUNDLE_ID)]
  BridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BridgeTests]
    dependencies:
      - target: Bridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BRIDGE_BUNDLE_ID).tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bridge.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Bridge"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # macOS: a menu-bar host (no Dock icon) for the Board · 看板 desktop widget. Same Keychain item
  # names as the iOS app, in a Mac-only access group shared with its widget extension.
  BridgeMac:
    type: application
    platform: macOS
    sources:
      - Mac
      - path: Shared
    dependencies:
      - target: BridgeMacWidget
    settings:
      base:
        PRODUCT_NAME: BridgeMac
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(BRIDGE_BUNDLE_ID).mac
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Mac/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: 白手套 Mac
        CFBundleDisplayName: 白手套 Mac
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        BridgeDefaultServerURL: $(BRIDGE_DEFAULT_SERVER_URL)
        BridgeAppBundleID: $(BRIDGE_BUNDLE_ID).mac
        BridgeAppGroup: $(TeamIdentifierPrefix)$(BRIDGE_BUNDLE_ID).mac
        BridgeKeychainGroup: $(AppIdentifierPrefix)$(BRIDGE_BUNDLE_ID).mac
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    postBuildScripts:
      - name: Build number = git commit count
        basedOnDependencyAnalysis: false
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        script: |
          count=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo "$CURRENT_PROJECT_VERSION")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $count" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    entitlements:
      path: Mac/BridgeMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)$(BRIDGE_BUNDLE_ID).mac]
        keychain-access-groups: [$(AppIdentifierPrefix)$(BRIDGE_BUNDLE_ID).mac]
  BridgeMacWidget:
    type: app-extension
    platform: macOS
    sources:
      - MacWidget
      - path: BridgeWidget/BoardWidget.swift
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: BridgeMacWidget
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(BRIDGE_BUNDLE_ID).mac.widget
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: MacWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: 白手套
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        BridgeAppBundleID: $(BRIDGE_BUNDLE_ID).mac
        BridgeAppGroup: $(TeamIdentifierPrefix)$(BRIDGE_BUNDLE_ID).mac
        BridgeKeychainGroup: $(AppIdentifierPrefix)$(BRIDGE_BUNDLE_ID).mac
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    postBuildScripts:
      - name: Build number = git commit count
        basedOnDependencyAnalysis: false
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        script: |
          count=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo "$CURRENT_PROJECT_VERSION")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $count" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    entitlements:
      path: MacWidget/BridgeMacWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)$(BRIDGE_BUNDLE_ID).mac]
        keychain-access-groups: [$(AppIdentifierPrefix)$(BRIDGE_BUNDLE_ID).mac]
  # Simulator helper, not a test suite: puts the board widgets on the home screen for screenshots.
  BridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BridgeUITests]
    dependencies:
      - target: Bridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BRIDGE_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Bridge
schemes:
  BridgeMac:
    build:
      targets:
        BridgeMac: all
  WidgetShots:
    build:
      targets:
        Bridge: all
        BridgeUITests: [test]
    test:
      targets: [BridgeUITests]
  Bridge:
    build:
      targets:
        Bridge: all
        BridgeTests: [test]
    test:
      targets: [BridgeTests]
      gatherCoverageData: false
