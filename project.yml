name: Bridge
configFiles:
  Debug: Config/Bridge.xcconfig
  Release: Config/Bridge.xcconfig
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Bundle id, team and default server URL come from Config/Bridge.xcconfig (+ your gitignored Config/Local.xcconfig).
    # Simulator builds are ad-hoc signed ("sign to run locally"); no team needed.
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  Bridge:
    type: application
    platform: iOS
    sources: [Bridge]
    settings:
      base:
        PRODUCT_NAME: Bridge
        PRODUCT_BUNDLE_IDENTIFIER: $(BRIDGE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: 白手套
    info:
      path: Bridge/Info.plist
      properties:
        CFBundleDisplayName: 白手套
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: "Bridge reads your health data (heart rate, HRV, sleep, workouts, steps…) and sends it only to the server URL you configure."
        NSLocationWhenInUseUsageDescription: "Bridge reports your current location to your server when it asks."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Bridge uses significant location changes to wake up and check your server for jobs, and reports a one-shot location when the server asks. No continuous GPS."
        NSCalendarsFullAccessUsageDescription: "Bridge lists your upcoming calendar events when your server asks, and sends them only to the server URL you configure."
        NSRemindersFullAccessUsageDescription: "Bridge lists and adds reminders when your server asks, and sends them only to the server URL you configure."
        NSContactsUsageDescription: "Bridge looks up a contact's name, phone numbers and emails when your server asks, and sends at most 20 matches to the server URL you configure."
        NSPhotoLibraryUsageDescription: "Bridge sends small, downscaled copies of your most recent photos to your server when it asks. Full-resolution images never leave the phone."
        NSMotionUsageDescription: "Bridge reports today's steps, distance and floors, and barometer readings, to your server when it asks."
        NSCameraUsageDescription: "Bridge opens the camera on screen when your server asks for a photo or a barcode scan. You see what the camera sees the whole time, and you take photos yourself."
        NSMicrophoneUsageDescription: "Bridge records a short voice clip when your server asks, while the app is open (iOS shows the orange dot). The clip goes only to the server URL you configure."
        NSSpeechRecognitionUsageDescription: "Bridge turns a voice clip it just recorded into text, on the phone when possible, and sends the text only to the server URL you configure."
        NFCReaderUsageDescription: "Bridge reads an NFC tag you hold the phone to when your server asks, and sends what the tag contains to the server URL you configure."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [fetch, processing, remote-notification, location]
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
          - $(PRODUCT_BUNDLE_IDENTIFIER).processing
        BridgeDefaultServerURL: $(BRIDGE_DEFAULT_SERVER_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Bridge/Bridge.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        aps-environment: development
        com.apple.developer.networking.wifi-info: true
        com.apple.developer.nfc.readersession.formats: [TAG]
  BridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BridgeTests]
    dependencies:
      - target: Bridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BRIDGE_BUNDLE_ID).tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bridge.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Bridge"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Bridge:
    build:
      targets:
        Bridge: all
        BridgeTests: [test]
    test:
      targets: [BridgeTests]
      gatherCoverageData: false
